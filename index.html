<style>
html{scroll-behavior:smooth}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes wordIn{from{opacity:0;transform:translateY(60%) rotate(4deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes floaty{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.15)}}
@keyframes slideIn{from{opacity:0;transform:translateX(50px) scale(.95)}to{opacity:1;transform:none}}
.fade-up{opacity:0;animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) forwards}
.slide-in{opacity:0;animation:slideIn 1s .6s cubic-bezier(.2,.8,.2,1) forwards}
.word{display:inline-block;opacity:0;animation:wordIn .7s cubic-bezier(.2,.8,.2,1) forwards}
.shine{background:linear-gradient(90deg,#34d399,#a7f3d0,#34d399,#6ee7b7);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite}
.blob{position:absolute;border-radius:9999px;filter:blur(70px);opacity:.35;animation:floaty 10s ease-in-out infinite;pointer-events:none}
.shine.word{animation:wordIn .7s cubic-bezier(.2,.8,.2,1) forwards,shimmer 3s linear infinite}
.reveal{opacity:0;transform:translateY(40px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.product-card{transition:box-shadow .3s ease,transform .5s ease,opacity .7s ease}
.product-card:hover{transform:translateY(-6px);box-shadow:0 20px 40px -12px rgba(22,163,74,.35)}
.img-zoom{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.product-card:hover .img-zoom{transform:scale(1.18)}
.img-zoom.big{transform:scale(1.3)}
.product-card:hover .img-zoom.big{transform:scale(1.5)}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#16a34a,#34d399);z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fade-up,.slide-in,.word,.reveal{opacity:1;transform:none}}
</style>
</head>
